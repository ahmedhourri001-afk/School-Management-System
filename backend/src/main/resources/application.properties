# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.sms=DEBUG
# Comptes de démonstration : mots de passe fournis uniquement par variables d'environnement
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.faculty-password=${SEED_FACULTY_PASSWORD}
app.seed.student-password=${SEED_STUDENT_PASSWORD}

# Seuil maximal d'absences (modifiable via la ConfigMap Kubernetes, sans rebuild de l'image)
app.absence.max-threshold=${ABSENCE_MAX_THRESHOLD:5}

# Actuator : santé de l'application (utilisée par Kubernetes et par Nagios)
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.diskspace.enabled=false
