# Profil de test : base H2 en mémoire, aucune dépendance à MySQL.
# Valeurs factices, utilisées uniquement par les tests automatiques.
spring.datasource.url=jdbc:h2:mem:smstest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-test-test-test-test-test-test-test-test
jwt.expiration=3600000

app.seed.admin-password=test-admin
app.seed.faculty-password=test-faculty
app.seed.student-password=test-student

app.absence.max-threshold=1
